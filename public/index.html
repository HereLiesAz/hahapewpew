<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191916">
<meta name="description" content="Three people, two of them robots, walking through the end of the world. An autonomous 3D fishbowl with AI dialogue.">
<link rel="canonical" href="https://www.hahapewpew.com/">
<title>haha pew pew — a living wasteland</title>
<link rel="stylesheet" href="/world3d.css">
</head>
<body>
<main id="experience" aria-label="Autonomous 3D post-apocalyptic fishbowl">
<canvas id="world" aria-label="Three-dimensional wasteland with Tab, Shift and Qwerty exploring the ruins"></canvas>
<div id="atmosphere" aria-hidden="true"></div>
<header id="hud">
  <div class="brand"><strong>haha pew pew</strong><span>an exceptionally bad future</span></div>
  <div class="site"><span id="site-name">THE WASTELAND</span><span id="distance">0.0 KM · NO SURVIVORS REPORTED</span></div>
</header>
<section id="speech" aria-label="Speech bubbles">
  <div class="bubble tab" id="say-tab" hidden></div>
  <div class="bubble shift" id="say-shift" hidden></div>
  <div class="bubble qwerty" id="say-qwerty" hidden></div>
</section>
<div id="bottom">
  <div id="log" role="log" aria-live="polite" aria-label="Recent dialogue"></div>
  <div class="controls" aria-label="World controls">
    <button id="follow" type="button" aria-pressed="true">FOLLOW</button>
    <button id="pause" type="button" aria-pressed="false">PAUSE</button>
    <button id="view" type="button">CAMERA</button>
  </div>
</div>
<div id="joystick" aria-label="Explore navigation">
  <button data-move="forward" aria-label="Go forward">▲</button>
  <div><button data-move="left" aria-label="Go left">◀</button><button data-move="back" aria-label="Go backward">▼</button><button data-move="right" aria-label="Go right">▶</button></div>
</div>
<div id="help">DRAG TO ORBIT · SCROLL TO ZOOM · FREE CAMERA: WASD / ARROWS</div>
<div id="boot" role="status">WAKING THE WASTELAND…</div>
<div id="dialogue-log" class="visually-hidden" role="log" aria-live="polite" aria-label="Accessible transcript"></div>
</main>
<script type="module" src="/boot3d.js"></script>
</body>
</html>
