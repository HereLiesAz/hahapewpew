name: Build character GLBs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/character-assets.yml'
      - 'scripts/make_assets.py'
      - 'scripts/activate_sculpt_assets.py'
      - 'tests/validate_sculpt_assets.py'
      - 'public/sculpt-loader.js'
permissions:
  contents: write
concurrency:
  group: hpp-character-asset-build
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic asset dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate and validate GLB exports
        run: |
          python scripts/make_assets.py
          python tests/validate_sculpt_assets.py
      - name: Activate assets and test website
        run: |
          python scripts/activate_sculpt_assets.py
          node --check public/sculpt-loader.js
          npm ci
          npm run check
      - name: Commit exported models if validated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/models/tab.glb public/assets/models/shift.glb public/assets/models/qwerty.glb public/world3d.js package.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install validated UV-textured rigged 3D character assets'
            git push origin HEAD:main
          fi
