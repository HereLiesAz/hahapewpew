name: Fetch and inspect Victoria GLB
on:
  push:
    branches: [feature/tab-victoria-body]
    paths:
      - .github/workflows/tab-victoria-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact public Rex Mun asset from official API
        shell: bash
        run: |
          mkdir -p artifacts/victoria
          python3 - <<'PY'
          import json,urllib.request,pathlib,hashlib,uuid
          from urllib.parse import quote,urlencode
          uuid='1fcc4446-1992-48ec-a160-9cd73ee35158'
          endpoint='https://www.blenderkit.com/api/v1/search/?query='+quote('Victoria Character Rigged')+'&asset_type=model'
          req=urllib.request.Request(endpoint,headers={'User-Agent':'HahaPewPew-Character-Importer/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as f:
              results=json.load(f)['results']
          choices=[r for r in results if r.get('assetBaseId')==uuid and r.get('author',{}).get('id')==310916]
          assert len(choices)==1, 'exact Victoria revision not found'
          meta=choices[0]
          source=next(f for f in meta['files'] if f.get('fileType')=='gltf')
          url=source['downloadUrl']+'?'+urlencode({'scene_uuid':str(uuid.uuid4())})
          print('Found',meta['name'],'revision',meta['id'],'GLB bytes',source['fileUploadSize'])
          req=urllib.request.Request(url,headers={'User-Agent':'HahaPewPew-Character-Importer/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=35) as r:
              raw=r.read(20000000)
              print('Download endpoint',r.status,r.headers.get('Content-Type'),'bytes',len(raw))
          if raw[:4]==b'glTF':
              payload=raw
          else:
              obj=json.loads(raw)
              print('Download response keys',list(obj.keys()))
              uri=next((obj[k] for k in ['filePath','downloadUrl','url'] if isinstance(obj.get(k),str) and obj[k].startswith('https://')),None)
              if not uri:raise RuntimeError('Official download endpoint returned no file URL')
              with urllib.request.urlopen(urllib.request.Request(uri,headers={'User-Agent':'HahaPewPew-Character-Importer/1.0'}),timeout=45) as f:
                  payload=f.read(20000000)
          if payload[:4]!=b'glTF':raise RuntimeError('Official GLTF file signature missing: '+repr(payload[:40]))
          out=pathlib.Path('artifacts/victoria/Victoria_RexMun_Source.glb')
          out.write_bytes(payload)
          print('Verified glTF bytes',len(payload),'sha256',hashlib.sha256(payload).hexdigest())
          header_bytes=int.from_bytes(payload[8:12],'little')
          if header_bytes!=len(payload):raise RuntimeError('GLB length mismatch')
          size=int.from_bytes(payload[12:16],'little')
          gltf=json.loads(payload[20:20+size])
          print('GLB skeletons',len(gltf.get('skins',[])),'nodes',len(gltf.get('nodes',[])),'meshes',len(gltf.get('meshes',[])))
          pathlib.Path('artifacts/victoria/manifest.json').write_text(json.dumps({
              'sourceAssetBaseId':uuid,'revisionId':meta['id'],'author':'Rex Mun',
              'license':meta['license'],'sha256':hashlib.sha256(payload).hexdigest(),
              'nodeNames':[n.get('name') for n in gltf.get('nodes',[])],
              'meshNames':[m.get('name') for m in gltf.get('meshes',[])],
              'skins':gltf.get('skins',[]),'animations':[a.get('name') for a in gltf.get('animations',[])]
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: victoria-source-inspection
          path: artifacts/victoria/
          if-no-files-found: warn
