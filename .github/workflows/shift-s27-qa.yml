name: Shift S2.7 visual QA
on:
  push:
    branches: [main]
    paths:
      - 'public/shift-motion.js'
      - 'public/shift-face-graphics.js'
      - 'public/character-models.js'
      - 'public/assets/characters/Shift_Rigged.glb'
      - 'public/assets/characters/Qwerty_Q16_Validated.glb'
      - 'workbench/shift/Shift_S28.glb'
      - 'workbench/shift/Shift_S29.glb'
      - 'scripts/shift_dome_s28.py'
      - 'tests/robot-proportions-s28.test.mjs'
      - 'tests/shift-materials-s26.test.mjs'
      - 'scripts/robot_proportions_browser_qa.mjs'
      - 'scripts/qwerty_head_hinge.py'
      - 'scripts/qwerty_depth_bounce.py'
      - 'scripts/shift_dome_s22.py'
      - 'tests/test_qwerty_depth_bounce.py'
      - 'tests/test_shift_dome_s22.py'
      - 'workbench/shift/Shift_Rigged_PreS28.glb'
      - 'public/shift-weapon.js'
      - 'tests/shift-weapon.test.mjs'
      - 'public/world3d.js'
      - 'workbench/shift/Shift_S27.glb'
      - 'tests/shift-sequences-s27.test.mjs'
      - 'scripts/shift_s27_browser_qa.mjs'
      - 'scripts/shift_sequences_s27.py'
  pull_request:
    paths:
      - 'public/shift-motion.js'
      - 'public/shift-face-graphics.js'
      - 'public/character-models.js'
      - 'public/assets/characters/Shift_Rigged.glb'
      - 'public/assets/characters/Qwerty_Q16_Validated.glb'
      - 'workbench/shift/Shift_S28.glb'
      - 'workbench/shift/Shift_S29.glb'
      - 'scripts/shift_dome_s28.py'
      - 'tests/robot-proportions-s28.test.mjs'
      - 'tests/shift-materials-s26.test.mjs'
      - 'scripts/robot_proportions_browser_qa.mjs'
      - 'scripts/qwerty_head_hinge.py'
      - 'scripts/qwerty_depth_bounce.py'
      - 'scripts/shift_dome_s22.py'
      - 'tests/test_qwerty_depth_bounce.py'
      - 'tests/test_shift_dome_s22.py'
      - 'workbench/shift/Shift_Rigged_PreS28.glb'
      - 'public/shift-weapon.js'
      - 'tests/shift-weapon.test.mjs'
      - 'public/world3d.js'
      - 'workbench/shift/Shift_S27.glb'
      - 'tests/shift-sequences-s27.test.mjs'
      - 'scripts/shift_s27_browser_qa.mjs'
      - 'scripts/shift_sequences_s27.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shift-s27:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Existing repository regression tests
        run: npm test
      - name: Python generator dependencies
        run: python3 -m pip install numpy
      - name: Complete Python GLB generators and structure
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Chromium browser setup
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual in-game front/side/turn/weapon/fallback
        run: node scripts/shift_s27_browser_qa.mjs artifacts/shift-s27
      - name: Capture production Qwerty scale and Shift circular-dome views
        run: node scripts/robot_proportions_browser_qa.mjs artifacts/robot-proportions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-s27-browser-evidence
          path: |
            artifacts/shift-s27
            artifacts/robot-proportions
          if-no-files-found: warn
