name: Export reference-matched Shift
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_reference_shift.py'
      - '.github/workflows/build-reference-shift.yml'
permissions:
  contents: write
concurrency:
  group: hpp-reference-shift-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reference-constrained GLB
        run: |
          python -m pip install --disable-pip-version-check numpy
          python scripts/build_reference_shift.py --out public/assets/characters/Shift_Rigged.glb
      - name: Verify armature, static eyes and rear dome
        run: |
          node --test tests/shift-reference-asset.test.mjs
          npm ci
          npm run check
      - name: Commit verified GLB only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/characters/Shift_Rigged.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Restore Shift gray dome across all viewing angles'
            git push origin HEAD:main
          fi
